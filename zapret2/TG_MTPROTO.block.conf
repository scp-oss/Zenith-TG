# TG_MTPROTO -- ЧЕРНОВИК блока zapret2/config для Telegram (обфусцированный
# MTProto поверх "голого" TCP, БЕЗ TLS ClientHello -- см. CLAUDE.md
# z2r_autobench "zapret1 vs zapret2 -- do not mix syntax", формат ниже
# написан под zapret2 (nfqws2), НЕ zapret1.
#
# ================================================================
# ТРЕБУЕТ ЖИВОЙ ПРОВЕРКИ ПЕРЕД ПРИМЕНЕНИЕМ -- у этой сессии нет
# исполнительного доступа к деплой-боксу (см. z2r_autobench/CLAUDE.md,
# "No execution access to the deployment box itself"), поэтому НИ ОДНА
# строка ниже не запускалась против настоящего nfqws2. Две РАЗНЫЕ вещи
# не проверены, не путать:
#   1) --filter-tcp/--ipset/--payload=unknown -- сам ГЕЙТ (какой трафик
#      матчить). Тут есть прямой прецедент из УЖЕ РАБОЧЕГО блока DS_TLS
#      в этом же проекте (Discord тоже смешивает TLS и не-TLS трафик на
#      одних портах, там уже есть "unknown" в --payload=) -- уверенность
#      выше, но --ipset= вместо --hostlist= для этого проекта всё равно
#      прецедента не имеет, нужно подтвердить, что именно так называется
#      флаг в ЭТОЙ сборке nfqws2 (не факт, что "--ipset=", а не
#      "--ipset-ip=" / другое имя -- сверить с `nfqws2 --help` на боксе).
#   2) --lua-desync= операторы ниже (fake/multisplit/...) -- САМИ ИМЕНА
#      операторов НЕ подтверждены против ЭТОЙ конкретной сборки nfqws2 --
#      "multisplit" реально существует в ОРИГИНАЛЬНОМ zapret1 (nfqws,
#      другой движок, см. CLAUDE.md "zapret1 vs zapret2 -- do not mix
#      syntax"), а не обязательно называется так же в --lua-desync=
#      этого форка. Перед тем, как вообще пробовать applying -- сверить
#      с реальными строками strategy=N, уже работающими в
#      /opt/zapret2/config на боксе (grep -A3 "circular_locked\|fake\|
#      multisplit\|disorder" по существующим профилям), не гадать
#      вслепую. Если синтаксис не совпадёт -- nfqws2 откажется
#      стартовать с явной ошибкой ("unrecognized option" и т.п., см.
#      CLAUDE.md), не тихо, это безопасный отказ, но лучше поймать его
#      руками до автотюна, а не через rank_strategies.sh перебором.
# ================================================================
#
# ПОЧЕМУ --ipset=, а не --hostlist=: у обфусцированного MTProto нет SNI
# и вообще никакого поля с доменным именем на TCP-уровне -- единственный
# признак, по которому его можно отличить от прочего трафика на 443/80,
# это IP назначения. --ipset=cidr/telegram_ipv4.txt (см.
# cidr/fetch_telegram_cidr.sh) -- официальные подсети Telegram DC.
#
# ПОЧЕМУ --payload=unknown: init-пакет MTProto obfuscated-транспорта --
#64 случайных на вид байта (см. prober/proto.py) -- не TLS ClientHello,
# не HTTP-запрос, не совпадает ни с одной сигнатурой из --payload=
# кроме "unknown" (нераспознанное содержимое). Порт 443 указан ПЕРВЫМ,
# т.к. это порт, который реально использует Telegram Desktop по
# умолчанию для прямого (не через MTProxy) подключения к DC; 80 -- на
# случай альтернативных сетевых профилей клиента, нужно подтвердить
# вживую, реально ли Desktop туда стучится в целевой сети, прежде чем
# оставлять в проде (лишний --filter-tcp= порт без реального трафика --
# просто мёртвый груз, ничего не тестирует).

--filter-tcp=443,80 --ipset=/opt/zapret2/extra_strats/cidr/telegram_ipv4.txt
--payload=unknown
--lua-desync=fake:multisplit=2

--new
